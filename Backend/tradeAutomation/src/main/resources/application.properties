spring.application.name=tradeAutomation

server.port=8080

# Activates application-local.properties, which holds real secrets and is gitignored.
# Create that file from application-local.properties.example before running the app.
spring.profiles.active=local

# ==========================================
# ANGEL ONE SMARTAPI
# ==========================================
# Values come from application-local.properties (not committed to git).
# angleone.local-ip / public-ip / mac-address are dummy values Angel One's API
# accepts for personal/non-production use; override in application-local.properties
# if your app registration requires real ones.
angleone.local-ip=127.0.0.1
angleone.public-ip=127.0.0.1
angleone.mac-address=00:00:00:00:00:00

# ==========================================
# DATABASE (Neon Cloud PostgreSQL)
# ==========================================
# Connection URL/username/password come from application-local.properties.
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
